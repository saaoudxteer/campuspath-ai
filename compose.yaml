name: campuspath-ai
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campuspath
      POSTGRES_USER: campuspath
      POSTGRES_PASSWORD: campuspath_local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - campuspath-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspath -d campuspath"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  campuspath-pg:
